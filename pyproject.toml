[project]
name = "operational-context-corpus"
version = "0.0.0"
description = "A reproducible corpus linking real autonomous-system telemetry to the external operating conditions under which it was produced."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Andrea Bozzo" }]

# Kept deliberately small. A dependency is added when an analysis in progress
# needs it, not in anticipation. See docs/00-scope.md.
dependencies = [
    "httpx>=0.28",
    "pyarrow>=18",
    "duckdb>=1.1",
    "numpy>=2.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# M4 onwards: ERA5 retrieval and agreement statistics.
context = ["cdsapi>=0.7", "xarray>=2024.10", "netCDF4>=1.7"]
analysis = ["scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "context", "events", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
